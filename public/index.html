<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title data-i18n="appTitle">AI 计划审阅室</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/flat-theme.css">
  </head>
  <body data-theme="light">
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">LOCAL AI COUNCIL</p>
          <h1 data-i18n="heading">计划审阅室</h1>
        </div>
        <div class="topbar-status" aria-label="正在连接本地服务" data-i18n-aria="connecting">
          <div class="language-switch" role="group" aria-label="Language">
            <button class="language-button active" type="button" data-language="zh" aria-pressed="true">中</button>
            <button class="language-button" type="button" data-language="en" aria-pressed="false">EN</button>
          </div>
          <button id="theme-toggle" class="topbar-button theme-button" type="button" aria-label="切换到深色模式" title="切换到深色模式">
            <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.6A8.3 8.3 0 0 1 8.4 4a8.4 8.4 0 1 0 11.6 11.6Z"/></svg>
          </button>
          <div class="model-health" aria-hidden="true">
            <span data-agent-health="claude"><img src="/logos/claude.svg" alt=""></span>
            <span data-agent-health="codex"><img src="/logos/codex.svg" alt=""></span>
            <span data-agent-health="gemini"><img src="/logos/gemini.svg" alt=""></span>
          </div>
          <span id="room-status">···</span>
          <button id="open-settings" class="topbar-button" type="button" aria-label="模型设置" title="模型设置" data-i18n-aria="modelSettings" data-i18n-title="modelSettings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm7.1-3.2c0-.5-.1-1-.2-1.5l2-1.5-2-3.4-2.4 1c-.7-.6-1.5-1.1-2.4-1.4L13.8 2h-4l-.4 3.1c-.9.3-1.7.8-2.4 1.4l-2.4-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3L2.6 15l2 3.4 2.4-1c.7.6 1.5 1.1 2.4 1.4l.4 3.1h4l.4-3.1c.9-.3 1.7-.8 2.4-1.4l2.4 1 2-3.4-2-1.5c.1-.5.2-1 .2-1.5Z"/></svg>
          </button>
          <span class="local-badge" role="img" aria-label="仅限本机" title="仅限本机" data-i18n-aria="localOnly" data-i18n-title="localOnly">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 10V7.6a4.5 4.5 0 0 1 9 0V10m-10 0h11a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 17.5 20h-11A1.5 1.5 0 0 1 5 18.5v-7A1.5 1.5 0 0 1 6.5 10Z"/></svg>
          </span>
        </div>
      </header>

      <main class="workspace">
        <aside class="panel project-panel" aria-label="项目" data-sidebar-panel="projects" data-i18n-aria="projects">
          <div class="panel-heading project-heading">
            <div class="sidebar-heading-title">
              <h2>Projects</h2>
              <span id="project-count" class="count">0</span>
            </div>
            <div class="sidebar-actions">
              <button id="add-projects" class="sidebar-action" type="button" aria-label="添加文件夹" title="添加文件夹" data-i18n-aria="addFolder" data-i18n-title="addFolder">＋</button>
              <button class="sidebar-toggle" type="button" data-sidebar-toggle="projects" data-sidebar-side="left" aria-label="收起 Projects" title="收起 Projects">‹</button>
            </div>
          </div>
          <div id="project-groups" class="project-groups"></div>
        </aside>

        <section class="chat-panel" aria-label="小组聊天室" data-i18n-aria="chatroom">
          <div class="chat-toolbar">
            <div class="toolbar-left">
              <div id="active-project" class="active-project" aria-live="polite"></div>
              <div class="session-control">
                <button id="session-menu-button" class="session-button" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="session-menu">
                  <span class="session-mark" aria-hidden="true"></span>
                  <span id="session-title" class="session-title"></span>
                  <span class="session-caret" aria-hidden="true">▾</span>
                </button>
                <button id="new-session" class="toolbar-icon" type="button" aria-label="新建会话" title="新建会话" data-i18n-aria="newSession" data-i18n-title="newSession">＋</button>
                <button id="new-window" class="toolbar-icon" type="button" aria-label="在新窗口打开" title="在新窗口打开" data-i18n-aria="newWindow" data-i18n-title="newWindow">⧉</button>
                <div id="session-menu" class="session-menu" role="menu" aria-label="会话" data-i18n-aria="sessions" hidden>
                  <div class="session-menu-heading">
                    <span data-i18n="sessions">会话</span>
                    <span id="session-count" class="count">0</span>
                  </div>
                  <div id="session-list" class="session-list"></div>
                  <button id="session-menu-new" class="session-menu-new" type="button" data-i18n="newSession">新建会话</button>
                </div>
              </div>
            </div>
            <div class="mode-switch" role="tablist" aria-label="工作模式" data-i18n-aria="workMode">
              <button class="mode-button active" type="button" role="tab" aria-selected="true" data-mode="chat"><span class="mode-icon chat-icon" aria-hidden="true"></span>Chat</button>
              <button class="mode-button" type="button" role="tab" aria-selected="false" data-mode="code"><span class="mode-icon code-icon" aria-hidden="true">‹›</span>Code</button>
            </div>
            <span class="toolbar-balance" aria-hidden="true"></span>
          </div>
          <div id="empty-state" class="empty-state">
            <div class="council-mark" aria-hidden="true">
              <span><img src="/logos/claude.svg" alt=""></span>
              <span><img src="/logos/codex.svg" alt=""></span>
              <span><img src="/logos/gemini.svg" alt=""></span>
            </div>
            <h2 data-i18n="startReview">开始审阅</h2>
          </div>
          <div id="messages" class="messages" aria-live="polite"></div>

          <form id="composer" class="composer">
            <div class="composer-controls">
              <label class="target-control" title="默认回复对象" data-i18n-title="defaultTarget">
                <span class="target-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path d="M8.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7-1a3 3 0 1 0 0-6m-13 15.5v-1.2c0-3 2.7-5.3 6-5.3s6 2.3 6 5.3v1.2m1-6.3c3 .3 5.2 2.4 5.2 5.1v1.2"/></svg>
                </span>
                <span class="sr-only" data-i18n="defaultTarget">默认回复对象</span>
                <select id="target">
                  <option value="group" data-i18n="parallelAll">全部并行</option>
                  <option value="claude">Claude</option>
                  <option value="codex">Codex</option>
                  <option value="gemini">Gemini</option>
                </select>
              </label>
            </div>
            <div class="mention-row">
              <button class="mention-chip" type="button" data-mention="Claude"><img src="/logos/claude.svg" alt="">@Claude</button>
              <button class="mention-chip" type="button" data-mention="Codex"><img src="/logos/codex.svg" alt="">@Codex</button>
              <button class="mention-chip" type="button" data-mention="Gemini"><img src="/logos/gemini.svg" alt="">@Gemini</button>
              <span id="route-preview" class="route-preview" hidden></span>
            </div>
            <textarea id="message" rows="4" maxlength="12000" placeholder="输入消息…" data-i18n-placeholder="messagePlaceholder" required></textarea>
            <div class="composer-footer">
              <span class="shortcut" aria-label="Command 或 Control 加 Enter 发送" data-i18n-aria="sendShortcut">⌘↵</span>
              <button id="send" class="primary-button" type="submit" aria-label="发送" title="发送" data-i18n-aria="send" data-i18n-title="send">
                <span aria-hidden="true">↑</span>
              </button>
            </div>
          </form>
        </section>

        <aside class="panel artifact-panel" aria-label="安全边界和文件草案" data-sidebar-panel="artifacts" data-i18n-aria="artifactPanel">
          <div class="artifact-panel-heading">
            <button class="sidebar-toggle" type="button" data-sidebar-toggle="artifacts" data-sidebar-side="right" aria-label="收起草案栏" title="收起草案栏">›</button>
          </div>
          <div class="safety-card">
            <h2 data-i18n="writeBoundary">写入边界</h2>
            <div class="permission-grid">
              <div class="permission allowed">
                <span class="permission-icon" aria-hidden="true">◉</span>
                <span data-i18n="read">读取</span>
                <strong data-i18n="currentProject">当前项目</strong>
              </div>
              <div class="permission allowed">
                <span class="permission-icon" aria-hidden="true">＋</span>
                <span data-i18n="create">新建</span>
                <strong><code>artifacts/</code></strong>
              </div>
              <div class="permission allowed">
                <span class="permission-icon" aria-hidden="true">✎</span>
                <span data-i18n="modify">修改</span>
                <strong data-i18n="managedFiles">托管文件</strong>
              </div>
              <div class="permission denied">
                <span class="permission-icon" aria-hidden="true">×</span>
                <span data-i18n="delete">删除</span>
                <strong data-i18n="disabled">禁用</strong>
              </div>
            </div>
          </div>

          <section class="artifact-section">
            <div class="panel-heading compact">
              <div>
                <h2 data-i18n="drafts">草案</h2>
              </div>
              <span id="proposal-count" class="count">0</span>
            </div>
            <div id="proposal-empty" class="artifact-empty" aria-label="暂无草案" data-i18n-aria="noDrafts"><span aria-hidden="true">◇</span></div>
            <div id="proposals" class="proposal-list"></div>
          </section>

          <section class="artifact-section managed-section">
            <div class="panel-heading compact">
              <div>
                <h2 data-i18n="createdFiles">已创建</h2>
              </div>
              <button id="refresh-artifacts" class="icon-button" type="button" aria-label="刷新文件" data-i18n-aria="refreshFiles">↻</button>
            </div>
            <div id="artifact-list" class="managed-list"></div>
          </section>
        </aside>
      </main>
    </div>

    <dialog id="preview-dialog" class="preview-dialog">
      <div class="dialog-heading">
        <div>
          <h2 id="preview-title" data-i18n="filePreview">文件预览</h2>
        </div>
        <button id="close-preview" class="icon-button" type="button" aria-label="关闭" data-i18n-aria="close">×</button>
      </div>
      <pre id="preview-content"></pre>
    </dialog>

    <dialog id="settings-dialog" class="settings-dialog">
      <div class="dialog-heading">
        <h2 data-i18n="modelSettings">模型设置</h2>
        <button id="close-settings" class="icon-button" type="button" aria-label="关闭" data-i18n-aria="close">×</button>
      </div>
      <form id="settings-form">
        <div class="settings-tabs" role="tablist" aria-label="AI">
          <button class="settings-tab active" type="button" role="tab" aria-selected="true" data-settings-tab="claude">
            <img src="/logos/claude.svg" alt="">Claude
          </button>
          <button class="settings-tab" type="button" role="tab" aria-selected="false" data-settings-tab="codex">
            <img src="/logos/codex.svg" alt="">Codex
          </button>
          <button class="settings-tab" type="button" role="tab" aria-selected="false" data-settings-tab="gemini">
            <img src="/logos/gemini.svg" alt="">Gemini
          </button>
        </div>

        <section class="settings-panel active" data-settings-panel="claude">
          <label class="setting-field">
            <span data-i18n="model">模型</span>
            <input type="text" maxlength="120" data-model="claude" list="claude-models" placeholder="CLI 默认" data-i18n-placeholder="cliDefault" autocomplete="off">
          </label>
          <button class="reauth-button" type="button" data-reauth="claude" data-i18n="signInAgain">重新登录</button>
          <label class="setting-field prompt-field">
            <span data-i18n="presetPrompt">预置 prompt</span>
            <textarea rows="8" maxlength="12000" data-prompt="claude" placeholder="未设置" data-i18n-placeholder="notSet"></textarea>
          </label>
        </section>
        <section class="settings-panel" data-settings-panel="codex" hidden>
          <label class="setting-field">
            <span data-i18n="model">模型</span>
            <input type="text" maxlength="120" data-model="codex" list="codex-models" placeholder="CLI 默认" data-i18n-placeholder="cliDefault" autocomplete="off">
          </label>
          <button class="reauth-button" type="button" data-reauth="codex" data-i18n="signInAgain">重新登录</button>
          <label class="setting-field prompt-field">
            <span data-i18n="presetPrompt">预置 prompt</span>
            <textarea rows="8" maxlength="12000" data-prompt="codex" placeholder="未设置" data-i18n-placeholder="notSet"></textarea>
          </label>
        </section>
        <section class="settings-panel" data-settings-panel="gemini" hidden>
          <label class="setting-field">
            <span data-i18n="model">模型</span>
            <input type="text" maxlength="120" data-model="gemini" list="gemini-models" placeholder="CLI 默认" data-i18n-placeholder="cliDefault" autocomplete="off">
          </label>
          <button class="reauth-button" type="button" data-reauth="gemini" data-i18n="signInAgain">重新登录</button>
          <label class="setting-field prompt-field">
            <span data-i18n="presetPrompt">预置 prompt</span>
            <textarea rows="8" maxlength="12000" data-prompt="gemini" placeholder="未设置" data-i18n-placeholder="notSet"></textarea>
          </label>
        </section>

        <div class="settings-footer">
          <button id="clear-agent-settings" class="secondary-button" type="button" data-i18n="clear">清空</button>
          <button class="save-settings" type="submit" data-i18n="save">保存</button>
        </div>
      </form>
    </dialog>

    <datalist id="claude-models"></datalist>
    <datalist id="codex-models"></datalist>
    <datalist id="gemini-models"></datalist>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/vendor/markdown-it.min.js"></script>
    <script src="/i18n.js"></script>
    <script src="/app.js" defer></script>
  </body>
</html>
